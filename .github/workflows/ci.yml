# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://help.github.com/actions/language-and-framework-guides/publishing-nodejs-packages

name: ci

on:
  release:
    types: [published]
  push:
    branches:
      - develop
      - staging
      - main # Change this to your default branch

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@plitzi'
          cache: 'yarn'

      - name: Cache node_modules
        id: cache-packages
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ secrets.CACHE_VERSION }}-${{ hashFiles('**/yarn.lock') }}

      - name: Yarn Token
        run: |
          yarn config set 'npmScopes["plitzi"]["npmRegistryServer"]' "https://npm.pkg.github.com/"
          yarn config set 'npmScopes["plitzi"]["npmAuthToken"]' "${{ secrets.NPM_AUTH_TOKEN }}"

      - name: Yarn Install
        if: steps.cache-packages.outputs.cache-hit != 'true'
        run: yarn install --immutable

  build-packages:
    needs: packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@plitzi'
          cache: 'yarn'

      - name: Restore Cache node_modules
        id: cache-packages
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ secrets.CACHE_VERSION }}-${{ hashFiles('**/yarn.lock') }}

      - name: Restore Cache build
        uses: actions/cache@v4
        env:
          cache-name: cache-build
        with:
          path: '**/dist'
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ secrets.CACHE_VERSION }}-${{ github.sha }}

      - name: Yarn Build
        run: yarn build:prod

      # `build:prod` regenerates the `exports` map from dist, but the publish job checks out the repo fresh and only
      # restores dist — so it publishes the COMMITTED manifest. A stale one ships a package whose exports do not
      # match its dist (a new subpath would silently be unreachable).
      - name: Verify committed exports match the build
        run: git diff --exit-code -- package.json

  lint:
    needs: build-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@plitzi'
          cache: 'yarn'

      - name: Restore Cache node_modules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ secrets.CACHE_VERSION }}-${{ hashFiles('**/yarn.lock') }}

      - name: Restore Cache build
        id: cache-packages
        uses: actions/cache@v4
        env:
          cache-name: cache-build
        with:
          path: '**/dist'
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ secrets.CACHE_VERSION }}-${{ github.sha }}

      - name: Validate Cache
        if: steps.cache-packages.outputs.cache-hit != 'true'
        run: exit 1

      - name: Yarn Lint
        run: yarn lint

      - name: Yarn Typecheck
        run: yarn typecheck

  tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@plitzi'
          cache: 'yarn'

      - name: Restore Cache node_modules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ secrets.CACHE_VERSION }}-${{ hashFiles('**/yarn.lock') }}

      - name: Yarn Tests
        run: yarn test

  publish:
    if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')
    needs: tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        registry:
          # - name: github
          #   url: https://npm.pkg.github.com/
          #   token: NPM_AUTH_TOKEN
          #   scope: '@plitzi'
          - name: npm
            url: https://registry.npmjs.org/
            token: NPMJS_TOKEN
            scope: '@plitzi'

    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      # No `registry-url` here, deliberately: the .npmrc setup-node writes for it still carries `always-auth`, which
      # npm 11 warns about on every command and drops in the next major. The four lines below are the same file
      # without the deprecated key — and being written here rather than generated is what lets the check after it
      # say something useful when the token is the problem.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'yarn'

      - name: Authenticate with ${{ matrix.registry.name }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets[matrix.registry.token] }}
          REGISTRY: ${{ matrix.registry.url }}
          SCOPE: ${{ matrix.registry.scope }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Secret ${{ matrix.registry.token }} is empty — an anonymous publish is what the registry answers as '404 Not Found - PUT'."
            exit 1
          fi
          host="${REGISTRY#https://}"
          {
            echo "${SCOPE}:registry=${REGISTRY}"
            echo "//${host}:_authToken=\${NODE_AUTH_TOKEN}"
          } > "$HOME/.npmrc"

      # A publish this token cannot make is a 404 on the PUT — the registry does not distinguish "no such package"
      # from "not yours", so the error names neither the token nor the account. This asks the question directly, and
      # the log then says whose token it is or that it is no longer valid.
      - name: Check the token is still valid
        env:
          NODE_AUTH_TOKEN: ${{ secrets[matrix.registry.token] }}
        run: npm whoami --registry ${{ matrix.registry.url }}

      - name: Restore Cache node_modules
        id: cache-packages
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ secrets.CACHE_VERSION }}-${{ hashFiles('**/yarn.lock') }}

      - name: Restore Cache build
        id: cache-build
        uses: actions/cache@v4
        env:
          cache-name: cache-build
        with:
          path: '**/dist'
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ secrets.CACHE_VERSION }}-${{ github.sha }}

      - name: Validate Cache
        if: steps.cache-packages.outputs.cache-hit != 'true' || steps.cache-build.outputs.cache-hit != 'true'
        run: exit 1

      # The tag is what a release is named after and the manifest is what the registry stores. When they disagree the
      # publish either fails on a version that already exists or ships one nobody tagged, and both read as something
      # else entirely. `yarn config set` used to run here to write the same credentials in Yarn's format; nothing in
      # this job is Yarn, and it left the token in a file in the checkout.
      - name: Check the tag matches the manifest
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          packaged="$(node -p "require('./package.json').version")"
          if [ "$tagged" != "$packaged" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json ($packaged). Nothing published."
            exit 1
          fi

      - name: Publish package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets[matrix.registry.token] }}
