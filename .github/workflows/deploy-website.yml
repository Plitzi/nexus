# Builds the website under website/ and deploys it to GitHub Pages.
name: deploy-website

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        working-directory: website
        run: npm ci

      - name: Pin @plitzi packages to the latest published release
        working-directory: website
        run: npm install @plitzi/nexus@latest --no-save --no-audit --no-fund

      - name: Build against published packages
        working-directory: website
        env:
          VITE_BASE: /nexus/
          VITE_USE_PUBLISHED: 'true'
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: site-nexus
          path: website/dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: _artifacts
          pattern: site-*

      - name: Assemble sites
        run: |
          mkdir -p _site
          for dir in _artifacts/site-*/; do
            name=${dir#_artifacts/site-}
            name=${name%/}
            mkdir -p "_site/$name"
            cp -r "$dir." "_site/$name/"
          done

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
