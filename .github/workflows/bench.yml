# nexus is the hot path of every page, the builder and the dev tools: no change may cost it speed (AGENTS.md § Rules).
# This holds it: the benchmark of nexus's own cases on the change and on its base, on the same runner, in turns, and
# the job fails when a case is slower than its base past its tolerance (`website/src/components/Benchmark/bench`) —
# or when a public entry grows past its size's (`scripts/entrySizes*.mjs`, `scripts/entrySizes.tolerances.json`).

name: bench

on:
  pull_request:
  push:
    branches:
      - main
  # A release is gated too (ci.yml), against the release before it: what is published is measured, not only what merged.
  workflow_call:
    inputs:
      base:
        description: The ref the change is measured against
        required: true
        type: string

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: head

      # The base: what the pull request goes into, or what this push came after.
      - uses: actions/checkout@v4
        with:
          path: base
          ref: ${{ inputs.base || (github.event_name == 'pull_request' && github.event.pull_request.base.sha) || github.event.before }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # A base from before the gate has nothing to measure itself with: said, and the gate starts on the next change.
      - name: The base has the gate
        id: gated
        run: |
          if [ -f base/website/src/components/Benchmark/bench/gate.ts ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The base predates the benchmark gate: nothing to compare with yet."
          fi

      # The website measures nexus from its source (`vite.config.ts` aliases it), so its own install is all a side needs.
      - name: Install
        if: steps.gated.outputs.yes == 'true'
        run: |
          (cd head/website && npm ci --no-audit --no-fund)
          (cd base/website && npm ci --no-audit --no-fund)

      # In turns, each the base then the head: a case is judged by the median of its turns' head ÷ base, so a moment the
      # runner is loaded slows one turn, which the others outvote.
      - name: Measure
        if: steps.gated.outputs.yes == 'true'
        run: |
          for turn in 1 2 3; do
            (cd base/website && npm run -s bench:gate -- "$RUNNER_TEMP/base-$turn.json")
            (cd head/website && npm run -s bench:gate -- "$RUNNER_TEMP/head-$turn.json")
          done

      # Soft: what it finds slower is written down, and confirmed below before anything fails.
      - name: Compare
        if: steps.gated.outputs.yes == 'true'
        working-directory: head/website
        run: |
          npm run -s bench:compare -- \
            --base "$RUNNER_TEMP"/base-{1,2,3}.json --head "$RUNNER_TEMP"/head-{1,2,3}.json \
            --soft --slower "$RUNNER_TEMP/slower.txt"

      # A case the first three turns found slower is measured in four more, and only what all seven find slower fails.
      - name: Confirm
        if: steps.gated.outputs.yes == 'true'
        run: |
          if [ ! -s "$RUNNER_TEMP/slower.txt" ]; then
            echo "Nothing to confirm."
            exit 0
          fi
          echo "::notice::Confirming: $(tr '\n' ' ' < "$RUNNER_TEMP/slower.txt")"
          for turn in 4 5 6 7; do
            (cd base/website && npm run -s bench:gate -- "$RUNNER_TEMP/base-$turn.json")
            (cd head/website && npm run -s bench:gate -- "$RUNNER_TEMP/head-$turn.json")
          done
          cd head/website
          npm run -s bench:compare -- \
            --base "$RUNNER_TEMP"/base-{1,2,3,4,5,6,7}.json --head "$RUNNER_TEMP"/head-{1,2,3,4,5,6,7}.json \
            --only "$RUNNER_TEMP/slower.txt"

      # What a consumer loads per public entry, compressed, on the change and its base: built from each side's own
      # install and measured by the head's script on both — a base from before it has its dist all the same.
      - name: Build both sides
        run: |
          corepack enable
          for side in base head; do
            (
              cd "$side"
              yarn install --immutable
              yarn build:prod
            )
          done

      - name: Entry sizes
        run: |
          (cd base && node ../head/scripts/entrySizes.mjs "$RUNNER_TEMP/sizes-base.json")
          (cd head && node scripts/entrySizes.mjs "$RUNNER_TEMP/sizes-head.json")
          node head/scripts/entrySizesCompare.mjs "$RUNNER_TEMP/sizes-base.json" "$RUNNER_TEMP/sizes-head.json"
